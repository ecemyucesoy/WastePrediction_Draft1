<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- ================= PANEL A: wMAPE ================= -->
  <rect x="30" y="20" width="550" height="470" rx="12" fill="#f7f8fa" stroke="#d9dde3"/>
  <text x="55" y="55" font-size="24" font-weight="bold" fill="#1f2a37">wMAPE</text>
  <text x="55" y="80" font-size="15" fill="#5f6b7a">Pool the errors across districts, then average</text>

  <text x="55" y="120" font-size="14" font-weight="bold" fill="#1f2a37">① Forecast error in each district (% of observed)</text>

  <!-- weights -->
  <circle cx="85"  cy="170" r="7"  fill="#e8a33d" opacity="0.85"/>
  <circle cx="131" cy="170" r="19" fill="#e8a33d" opacity="0.85"/>
  <circle cx="177" cy="170" r="10" fill="#e8a33d" opacity="0.85"/>
  <circle cx="223" cy="170" r="15" fill="#e8a33d" opacity="0.85"/>
  <circle cx="269" cy="170" r="8"  fill="#e8a33d" opacity="0.85"/>
  <circle cx="315" cy="170" r="12" fill="#e8a33d" opacity="0.85"/>
  <text x="55" y="208" font-size="12" fill="#5f6b7a">circle size = under-5 population (the weight)</text>

  <!-- error bars -->
  <rect x="70"  y="305" width="30" height="35"  fill="#d1603d"/>
  <rect x="116" y="260" width="30" height="80"  fill="#d1603d"/>
  <rect x="162" y="290" width="30" height="50"  fill="#d1603d"/>
  <rect x="208" y="220" width="30" height="120" fill="#d1603d"/>
  <rect x="254" y="312" width="30" height="28"  fill="#d1603d"/>
  <rect x="300" y="275" width="30" height="65"  fill="#d1603d"/>
  <line x1="60" y1="340" x2="345" y2="340" stroke="#5f6b7a"/>
  <g font-size="12" fill="#5f6b7a" text-anchor="middle">
    <text x="85" y="358">D1</text><text x="131" y="358">D2</text><text x="177" y="358">D3</text>
    <text x="223" y="358">D4</text><text x="269" y="358">D5</text><text x="315" y="358">D6 …</text>
  </g>

  <!-- arrow -->
  <g font-size="12" fill="#5f6b7a" text-anchor="middle">
    <text x="385" y="225">weighted</text><text x="385" y="241">average</text>
  </g>
  <line x1="362" y1="255" x2="408" y2="255" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="425" y="120" font-size="14" font-weight="bold" fill="#1f2a37">② One number</text>
  <rect x="455" y="250" width="45" height="90" fill="#d1603d"/>
  <line x1="425" y1="240" x2="550" y2="240" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="425" y="228" font-size="12" fill="#5f6b7a">persistence's wMAPE</text>
  <line x1="425" y1="340" x2="550" y2="340" stroke="#5f6b7a"/>
  <text x="477" y="358" font-size="12" fill="#5f6b7a" text-anchor="middle">model wMAPE</text>
  <text x="477" y="378" font-size="12" fill="#5f6b7a" text-anchor="middle">lower = better</text>

  <g font-size="14" fill="#1f2a37">
    <text x="55" y="415">Each district's error is a % of its own observed value;</text>
    <text x="55" y="435">districts are then pooled, and big districts count more.</text>
    <text x="55" y="455">Persistence is scored the same way: only a reference line.</text>
  </g>
  <text x="55" y="480" font-size="13" font-weight="bold" fill="#2a6fb0">Answers: how large are the errors, weighting big districts more?</text>

  <!-- ================= PANEL B: geoP ================= -->
  <rect x="620" y="20" width="550" height="470" rx="12" fill="#f7f8fa" stroke="#d9dde3"/>
  <text x="645" y="55" font-size="24" font-weight="bold" fill="#1f2a37">geoP</text>
  <text x="645" y="80" font-size="15" fill="#5f6b7a">Compare with persistence in each district, then average</text>

  <text x="645" y="120" font-size="14" font-weight="bold" fill="#1f2a37">① Model vs persistence, per district</text>

  <!-- legend -->
  <rect x="655" y="155" width="11" height="11" fill="#2a6fb0"/>
  <text x="671" y="165" font-size="12" fill="#5f6b7a">model error</text>
  <rect x="760" y="155" width="11" height="11" fill="#9aa0a6"/>
  <text x="776" y="165" font-size="12" fill="#5f6b7a">persistence error</text>

  <!-- paired bars -->
  <g>
    <rect x="655" y="286" width="14" height="54"  fill="#2a6fb0"/><rect x="671" y="250" width="14" height="90"  fill="#9aa0a6"/>
    <rect x="697" y="272" width="14" height="68"  fill="#2a6fb0"/><rect x="713" y="295" width="14" height="45"  fill="#9aa0a6"/>
    <rect x="739" y="272" width="14" height="68"  fill="#2a6fb0"/><rect x="755" y="205" width="14" height="135" fill="#9aa0a6"/>
    <rect x="781" y="235" width="14" height="105" fill="#2a6fb0"/><rect x="797" y="280" width="14" height="60"  fill="#9aa0a6"/>
    <rect x="823" y="295" width="14" height="45"  fill="#2a6fb0"/><rect x="839" y="250" width="14" height="90"  fill="#9aa0a6"/>
    <rect x="865" y="244" width="14" height="96"  fill="#2a6fb0"/><rect x="881" y="292" width="14" height="48"  fill="#9aa0a6"/>
  </g>
  <line x1="645" y1="340" x2="905" y2="340" stroke="#5f6b7a"/>
  <g font-size="12" fill="#5f6b7a" text-anchor="middle">
    <text x="670" y="358">D1</text><text x="712" y="358">D2</text><text x="754" y="358">D3</text>
    <text x="796" y="358">D4</text><text x="838" y="358">D5</text><text x="880" y="358">D6 …</text>
  </g>

  <!-- arrow -->
  <g font-size="12" fill="#5f6b7a" text-anchor="middle">
    <text x="928" y="225">model ÷</text><text x="928" y="241">persistence</text>
  </g>
  <line x1="908" y1="255" x2="950" y2="255" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="962" y="120" font-size="13" font-weight="bold" fill="#1f2a37">② Ratios → geometric mean</text>

  <!-- log axis with ratio dots -->
  <line x1="1057" y1="178" x2="1057" y2="310" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1057" y="170" font-size="12" fill="#5f6b7a" text-anchor="middle">= persistence (ratio 1)</text>
  <line x1="965" y1="310" x2="1150" y2="310" stroke="#5f6b7a"/>
  <g stroke="#5f6b7a"><line x1="1019" y1="306" x2="1019" y2="314"/><line x1="1057" y1="306" x2="1057" y2="314"/><line x1="1095" y1="306" x2="1095" y2="314"/></g>
  <g font-size="12" fill="#5f6b7a" text-anchor="middle"><text x="1019" y="328">0.5</text><text x="1057" y="328">1</text><text x="1095" y="328">2</text></g>
  <g fill="#2a6fb0">
    <circle cx="1029" cy="195" r="5"/><circle cx="1080" cy="213" r="5"/><circle cx="1019" cy="231" r="5"/>
    <circle cx="1088" cy="249" r="5"/><circle cx="1019" cy="267" r="5"/><circle cx="1095" cy="285" r="5"/>
  </g>
  <g font-size="11" fill="#8a94a3">
    <text x="972" y="199">D1</text><text x="972" y="217">D2</text><text x="972" y="235">D3</text>
    <text x="972" y="253">D4</text><text x="972" y="271">D5</text><text x="972" y="289">D6</text>
  </g>
  <polygon points="1055,300 1063,310 1055,320 1047,310" fill="#2a9d8f"/>
  <text x="1055" y="348" font-size="13" font-weight="bold" fill="#2a9d8f" text-anchor="middle">geometric mean = geoP</text>
  <text x="965" y="368" font-size="12" fill="#5f6b7a">◂ model better</text>
  <text x="1150" y="368" font-size="12" fill="#5f6b7a" text-anchor="end">worse ▸</text>

  <g font-size="14" fill="#1f2a37">
    <text x="645" y="415">Within each district: model error ÷ persistence error.</text>
    <text x="645" y="435">The ratios are then averaged (geometric mean),</text>
    <text x="645" y="455">so every district counts equally.</text>
  </g>
  <text x="645" y="480" font-size="13" font-weight="bold" fill="#2a6fb0">Answers: is the model better than persistence in the typical district?</text>

  <!-- ================= BANNER ================= -->
  <rect x="30" y="510" width="1140" height="72" rx="12" fill="#eef3f9" stroke="#d3dfee"/>
  <text x="600" y="540" font-size="18" font-weight="bold" fill="#1f2a37" text-anchor="middle">wMAPE: average across districts first   |   geoP: compare within each district first</text>
  <text x="600" y="566" font-size="15" fill="#5f6b7a" text-anchor="middle">wMAPE speaks for the large districts · geoP speaks for the typical district</text>
</svg>
